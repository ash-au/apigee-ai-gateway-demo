<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" class="apigee-ledger-emblem" role="img" aria-label="Apigee X AI Economics &amp; Governance Gateway Emblem">
  <style>
    .apigee-ledger-emblem {
      color: var(--ink-primary, var(--text-primary, #141618));
      --_accent-primary: var(--accent-primary, var(--accent, #164E63));
      --_accent-secondary: var(--accent-secondary, var(--accent-amber, #923E05));
    }
    @media (prefers-color-scheme: dark) {
      .apigee-ledger-emblem {
        color: var(--ink-primary, var(--text-primary, #EDEAE2));
        --_accent-primary: var(--accent-primary, var(--accent, #38BDF8));
        --_accent-secondary: var(--accent-secondary, var(--accent-amber, #FBBF24));
      }
    }
  </style>
  <!-- Outer chamfered octagonal archival ledger seal -->
  <path d="M 8.5 2.5 H 31.5 L 37.5 8.5 V 31.5 L 31.5 37.5 H 8.5 L 2.5 31.5 V 8.5 Z" stroke="currentColor" stroke-opacity="0.48" stroke-width="1.25" stroke-linejoin="miter"/>
  <!-- Verification axis calibration ticks -->
  <path d="M 20 3.125 V 6.25 M 20 33.75 V 36.875" stroke="currentColor" stroke-opacity="0.34" stroke-width="1.25" stroke-linecap="butt"/>
  <!-- Incoming prompt vector (hollow ingress node -> compressed beam) -->
  <circle cx="7.5" cy="20" r="1.65" stroke="currentColor" stroke-width="1.25"/>
  <path d="M 9.15 20 H 12.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt"/>
  <!-- Lower calibrated escalation path -> Frontier Amber accent dot -->
  <path d="M 23.75 23.75 L 26.5 26.5 H 30.75" stroke="currentColor" stroke-opacity="0.56" stroke-width="1.25" stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- Upper calibrated fast teal lane -> Teal diamond node -->
  <path d="M 23.5 16.5 L 26.5 13.5 H 31" stroke="var(--_accent-primary)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- Central Apigee routing prism & verification core -->
  <path d="M 20 13.5 L 26.5 20 L 20 26.5 L 13.5 20 Z" fill="var(--_accent-primary)" fill-opacity="0.11" stroke="var(--_accent-primary)" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M 20 17.75 L 22.25 20 L 20 22.25 L 17.75 20 Z" fill="var(--_accent-primary)"/>
  <!-- Calibrated output nodes: Fast Teal diamond + Frontier Amber dot -->
  <path d="M 32.5 11.25 L 34.75 13.5 L 32.5 15.75 L 30.25 13.5 Z" fill="var(--_accent-primary)"/>
  <circle cx="32.5" cy="26.5" r="2.25" fill="var(--_accent-secondary)"/>
</svg>
<!-- impeccable-source-prompt: Bespoke 40x40 architectural dual-node gateway prism & archival FinOps ledger seal for the Apigee X AI Economics & Governance Gateway: chamfered octagonal hairline frame with verification axis ticks, hollow ingress prompt vector compressing into a central Apigee routing diamond with inner verification core, splitting orthogonally into a fast teal lane (teal diamond terminal) and a calibrated frontier escalation path (luminous amber accent dot). Adaptive light Archival Paper (#164E63/#923E05/#141618) and dark Carbon Obsidian (#38BDF8/#FBBF24/#EDEAE2) tokens. -->
